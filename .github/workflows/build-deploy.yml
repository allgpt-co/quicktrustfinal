name: Build Backend Image & Deploy

on:
  workflow_call:
    inputs:
      deploy_needed:
        description: Build and deploy the backend after the caller's security gate passes
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      bootstrap_gateway:
        description: One-time protected gateway credential bootstrap
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: quicktrust-production-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  OIDC_AUDIENCE: quickintell-deploy

jobs:
  bootstrap-gateway:
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_gateway
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inject protected Coolify credential and restart gateway
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$COOLIFY_API_TOKEN"
          payload="$(jq -cn --arg value "$COOLIFY_API_TOKEN" '{data:[{key:"COOLIFY_API_TOKEN",value:$value,is_buildtime:false,is_runtime:true,is_preview:false}]}')"

          curl --fail-with-body --silent --show-error \
            --output /dev/null \
            --request PATCH \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://infra.quickintell.com:8444/api/v1/applications/hgdlx4sbgs8oybl4k9wm0uxm/envs/bulk"

          curl --fail-with-body --silent --show-error \
            --output /dev/null \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "https://infra.quickintell.com:8444/api/v1/deploy?uuid=hgdlx4sbgs8oybl4k9wm0uxm&force=false"

  build-and-deploy:
    if: >-
      !inputs.bootstrap_gateway &&
      (github.event_name == 'workflow_dispatch' || inputs.deploy_needed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push immutable image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ECR_REPOSITORY:?ECR_REPOSITORY repository variable is required}"
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --build-arg "BUILD_SHA=$IMAGE_TAG" \
            --tag "$image_uri" \
            ./backend
          docker push "$image_uri"

          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ECR did not return a valid image digest" >&2
            exit 1
          fi

          echo "IMAGE_REF=$ECR_REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_ENV"

      - name: Request verified production deployment
        env:
          BROKER_URL: ${{ vars.DEPLOYMENT_GATEWAY_URL }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BROKER_URL:?DEPLOYMENT_GATEWAY_URL repository variable is required}"
          : "${IMAGE_REF:?IMAGE_REF was not produced}"

          oidc_token() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | jq -er '.value'
          }

          token="$(oidc_token)"
          echo "::add-mask::$token"
          payload="$(jq -cn \
            --arg service quicktrust-backend \
            --arg commit "$COMMIT_SHA" \
            --arg image "$IMAGE_REF" \
            '{service:$service,commit:$commit,image:$image}')"

          response="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-connrefused \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data "$payload" \
            "$BROKER_URL/github/deploy")"
          request_id="$(jq -er '.request_id' <<<"$response")"

          for attempt in $(seq 1 80); do
            if (( attempt == 1 || (attempt - 1) % 16 == 0 )); then
              token="$(oidc_token)"
              echo "::add-mask::$token"
            fi

            status_response="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $token" \
              "$BROKER_URL/github/deploy/$request_id")"
            status="$(jq -er '.status' <<<"$status_response")"
            echo "Deployment status: $status"

            case "$status" in
              verified)
                deployed_commit="$(jq -er '.commit_sha' <<<"$status_response")"
                [[ "$deployed_commit" == "$COMMIT_SHA" ]]
                exit 0
                ;;
              failed|rolled_back|rollback_failed)
                error="$(jq -r '.error // "deployment failed"' <<<"$status_response")"
                echo "$error" >&2
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "Deployment verification timed out" >&2
          exit 1