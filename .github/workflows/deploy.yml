name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: |
          docker build -t ${{ vars.REGISTRY }}/quicktrust-api:${{ github.sha }} --target production backend/
          docker build -t ${{ vars.REGISTRY }}/quicktrust-web:${{ github.sha }} --target production frontend/

      - name: Push images to registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ vars.REGISTRY }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
          docker push ${{ vars.REGISTRY }}/quicktrust-api:${{ github.sha }}
          docker push ${{ vars.REGISTRY }}/quicktrust-web:${{ github.sha }}

      - name: Deploy to staging server
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          echo "Deploying commit ${{ github.sha }} to staging"
          # Configure SSH
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Deploy via SSH
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${STAGING_USER}@${STAGING_HOST} << 'DEPLOY'
            cd /opt/quicktrust
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec api python -m alembic upgrade head
          DEPLOY

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Tag images for production
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ vars.REGISTRY }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
          docker pull ${{ vars.REGISTRY }}/quicktrust-api:${{ github.sha }}
          docker pull ${{ vars.REGISTRY }}/quicktrust-web:${{ github.sha }}
          docker tag ${{ vars.REGISTRY }}/quicktrust-api:${{ github.sha }} ${{ vars.REGISTRY }}/quicktrust-api:latest
          docker tag ${{ vars.REGISTRY }}/quicktrust-web:${{ github.sha }} ${{ vars.REGISTRY }}/quicktrust-web:latest
          docker push ${{ vars.REGISTRY }}/quicktrust-api:latest
          docker push ${{ vars.REGISTRY }}/quicktrust-web:latest

      - name: Deploy to production server
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          echo "Deploying commit ${{ github.sha }} to production"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${PRODUCTION_USER}@${PRODUCTION_HOST} << 'DEPLOY'
            cd /opt/quicktrust
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec api python -m alembic upgrade head
          DEPLOY
